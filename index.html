<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="description" content="帮你决定今天吃什么的美食选择应用" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="今天吃什么" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>今天吃什么</title>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!-- 动态主题色脚本 -->
    <script>
        // 主题色映射 - 使用更浅的颜色用于状态栏
        const themeColors = {
            'default': '#e0e7ff',    // 默认主题 - 浅蓝紫色
            'dark': '#1e293b',       // 深色主题 - 浅深色
            'sunset': '#fed7aa',     // 日落主题 - 浅橙色
            'ocean': '#cffafe',      // 海洋主题 - 浅青色
            'forest': '#dcfce7',     // 森林主题 - 浅绿色
            'vintage': '#f3e8ff'     // 复古主题 - 浅紫色
        };

        // 将十六进制颜色转换为RGBA格式
        function hexToRgba(hex, alpha) {
            const color = hex.replace('#', '');
            if (color.length !== 6) return `rgba(99, 102, 241, ${alpha})`; // 默认颜色

            const r = parseInt(color.substr(0, 2), 16);
            const g = parseInt(color.substr(2, 2), 16);
            const b = parseInt(color.substr(4, 2), 16);

            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // 更新主题色的函数
        function updateThemeColor(themeId) {
            const metaElement = document.getElementById('theme-color-meta');
            const color = themeColors[themeId] || themeColors['default'];
            if (metaElement) {
                metaElement.setAttribute('content', color);
            }
        }

        // 监听主题变化
        function watchThemeChanges() {
            // 监听 body 的 class 变化
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                        const bodyClass = document.body.className;
                        // 提取主题ID
                        const themeMatch = bodyClass.match(/theme-(\w+)/);
                        if (themeMatch) {
                            const themeId = themeMatch[1];
                            updateThemeColor(themeId);
                        }
                    }
                });
            });

            observer.observe(document.body, {
                attributes: true,
                attributeFilter: ['class']
            });

            // 初始化主题色
            const currentTheme = document.body.className.match(/theme-(\w+)/);
            if (currentTheme) {
                updateThemeColor(currentTheme[1]);
            } else {
                updateThemeColor('default');
            }
        }

        // 页面加载完成后启动主题监听
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', watchThemeChanges);
        } else {
            watchThemeChanges();
        }
    </script>
</body>

</html>
